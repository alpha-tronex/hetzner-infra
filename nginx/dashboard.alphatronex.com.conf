# dashboard.alphatronex.com — apps overview dashboard. A single static page
# (host, port, address and CI/CD state per app), NOT proxied to a container.
# Served directly from /var/www/dashboard on the server. Source lives in
# ../dashboard/ in this repo; deploy with:
#   rsync -a --delete --chmod=D755,F644 dashboard/ hetzner:/var/www/dashboard/
#
# The page names internal hostnames and ports, so the whole vhost sits behind
# HTTP basic auth. One-time setup on the server:
#   sudo apt install -y apache2-utils
#   sudo htpasswd -c /etc/nginx/.htpasswd-dashboard alpha
#   sudo mkdir -p /var/www/dashboard && sudo chown alphathiam:alphathiam /var/www/dashboard
#
# Install HTTP-only first, then `sudo certbot --nginx -d dashboard.alphatronex.com`
# adds the 443/ssl lines — copy the result back into this file afterwards.

server {
    server_name dashboard.alphatronex.com;
    root /var/www/dashboard;
    index index.html;

    auth_basic "Dashboard";
    auth_basic_user_file /etc/nginx/.htpasswd-dashboard;

    add_header X-Robots-Tag "noindex, nofollow" always;

    location / {
        try_files $uri $uri/ =404;
    }

    listen 80;
}
