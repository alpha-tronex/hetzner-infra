# Vhost for the FAIS dev box (fais-dev container, docker-compose.dev.yml in the FAIS repo, deployed
# from the dev branch out of /opt/fais-dev, published to host port 8030) on the shared box. Debug
# build, synthetic data only. Basic auth on everything except /api/health, which CI's smoke test
# calls; the password is in /etc/nginx/fais-dev.htpasswd (user alpha). Certbot adds the TLS lines.

server {
    server_name dev.faislaw.com;

    client_max_body_size 20M; # document/PDF uploads, as on the demo
    add_header X-Robots-Tag "noindex, nofollow" always;

    location = /api/health {
        proxy_pass http://127.0.0.1:8030;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        auth_basic "FAIS dev";
        auth_basic_user_file /etc/nginx/fais-dev.htpasswd;

        proxy_pass http://127.0.0.1:8030;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/dev.faislaw.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/dev.faislaw.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}


server {
    if ($host = dev.faislaw.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    server_name dev.faislaw.com;

    listen 80;
    return 404; # managed by Certbot


}