# Real Dosing (supplement price comparison) — canonical domain, purchased
# 2026-07-20. Static files, NOT proxied to a container. Served directly from
# /var/www/realdosing on the server (same content dir as the legacy
# realdosing.alphatronex.com vhost, which now just 301s here — see
# realdosing.alphatronex.com.conf).
#
# Source lives in the supplement-price-app repo (web/ — 7 category pages,
# common.js, per-category *.data.js / *.app.js, style.css). This repo only
# carries the nginx vhost, matching the FAIS pattern where the app source
# lives elsewhere. Deploy with:
#   rsync -a /Users/alphathiam/Documents/Development/GitHub/supplement-price-app/web/ hetzner:/var/www/realdosing/

server {
    server_name dosinghub.com www.dosinghub.com;
    root /var/www/realdosing;
    index index.html;
    location / {
        try_files $uri $uri/ =404;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/dosinghub.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/dosinghub.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot


}
server {
    if ($host = www.dosinghub.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    if ($host = dosinghub.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    server_name dosinghub.com www.dosinghub.com;

    listen 80;
    return 404; # managed by Certbot




}