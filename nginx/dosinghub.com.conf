# Real Dosing (supplement price comparison) — canonical domain, purchased
# 2026-07-20. Static files, NOT proxied to a container. Served directly from
# /var/www/realdosing on the server. The legacy realdosing.alphatronex.com
# subdomain (briefly a redirect to here) was fully decommissioned 2026-07-20
# — vhost, cert, and DNS record all removed.
#
# 2026-07-21: migrated from the old flat web/ static site to the Angular SSG
# build (app/dist/app/browser/ — prerendered routes, no Node runtime at
# request time). Source lives in the supplement-price-app repo. This repo
# only carries the nginx vhost, matching the FAIS pattern where the app
# source lives elsewhere. Deploy with:
#   rsync -a --delete /Users/alphathiam/Documents/Development/GitHub/supplement-price-app/app/dist/app/browser/ hetzner:/var/www/realdosing/

server {
    server_name dosinghub.com www.dosinghub.com;
    root /var/www/realdosing;
    index index.html;

    # Preserve search ranking/backlinks from the old flat-file URLs indexed
    # before the Angular migration (e.g. dosinghub.com/vitamin-d.html) by
    # 301-redirecting to the new clean-path routes.
    rewrite ^/(categories|blog|omega3|creatine|vitamin-d|vitamin-c|calcium|protein|search)\.html$ /$1 permanent;

    # $request_uri (not a plain rewrite) so this only fires for a literal
    # "/index.html" request -- nginx's `index` directive internally
    # re-enters the rewrite phase as "/index.html" for a bare "/" request,
    # and a plain `rewrite ^/index\.html$ / permanent;` would catch that
    # internal redirect too, causing an infinite "/" -> "/" loop.
    if ($request_uri = /index.html) {
        return 301 /;
    }

    error_page 404 /404/index.html;

    location / {
        try_files $uri $uri/ =404;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/dosinghub.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/dosinghub.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot


}
server {
    if ($host = www.dosinghub.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    if ($host = dosinghub.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    server_name dosinghub.com www.dosinghub.com;

    listen 80;
    return 404; # managed by Certbot




}