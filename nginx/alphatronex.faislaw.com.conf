# Vhost for the Alpha Tronex test firm on the client-data server fais-clients (178.156.222.192):
# fais-alphatronex container, app-alphatronex service in FAIS/docker-compose.clients.yml, host
# port 8011. Fictional firm used to test FAIS with demo mode off and to rehearse onboarding
# (FAIS/docs/ONBOARDING_RUNBOOK.md). Replaces alphatronex.fais.alphatronex.com, which the shared box
# now 301-redirects here. Live, certbot-managed version: certificate issued 2026-10-23,
# expires 2027-01-21, auto-renews on fais-clients.

server {
    server_name alphatronex.faislaw.com;

    client_max_body_size 20M; # document/PDF uploads

    location / {
        proxy_pass http://127.0.0.1:8011;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/alphatronex.faislaw.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/alphatronex.faislaw.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}


server {
    if ($host = alphatronex.faislaw.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    server_name alphatronex.faislaw.com;

    listen 80;
    return 404; # managed by Certbot


}