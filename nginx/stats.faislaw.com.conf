# Vhost for Umami, the self-hosted visitor analytics for www.faislaw.com and demo.faislaw.com
# (docker-compose.analytics.yml in the FAIS repo, compose project fais-analytics, run from /opt/fais
# and published to host port 8040; 8020 is Quiz Master's). Serves the dashboard (its own login, with
# two-factor) and the tracker script and collect API the FAIS client calls. Not indexed: the login
# page has no business in search results. Certbot adds the TLS lines. Set up 2026-11-22; runbook:
# docs/operations/WEB_ANALYTICS.md in the FAIS repo.

server {
    server_name stats.faislaw.com;

    add_header X-Robots-Tag "noindex, nofollow" always;

    location / {
        proxy_pass http://127.0.0.1:8040;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/stats.faislaw.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/stats.faislaw.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}


server {
    if ($host = stats.faislaw.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    server_name stats.faislaw.com;

    listen 80;
    return 404; # managed by Certbot


}
