# Vhost for FAIS (fais-app container, docker-compose.prod.yml in the FAIS repo,
# published to host port 8010). This is the live, certbot-managed version —
# deployed 2026-07-17, TLS cert expires 2026-10-15 (auto-renews via certbot).

server {
    server_name fais.alphatronex.com;

    client_max_body_size 20M; # document/PDF uploads

    location / {
        proxy_pass http://127.0.0.1:8010;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/fais.alphatronex.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/fais.alphatronex.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}


server {
    if ($host = fais.alphatronex.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    server_name fais.alphatronex.com;
    return 404; # managed by Certbot


}
