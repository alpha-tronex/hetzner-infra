# Vhost for FAIS (fais-app container, docker-compose.prod.yml in the FAIS repo,
# published to host port 8010).
#
# Deploy steps on the server:
#   1. Copy this file to /etc/nginx/sites-available/fais.alphatronex.com.conf
#   2. ln -s /etc/nginx/sites-available/fais.alphatronex.com.conf /etc/nginx/sites-enabled/
#   3. nginx -t && systemctl reload nginx
#   4. certbot --nginx -d fais.alphatronex.com
#      (this rewrites the file in place to add the SSL server block + HTTP->HTTPS
#      redirect, same as the assistant/status/vault vhosts on this box)

server {
    listen 80;
    server_name fais.alphatronex.com;

    client_max_body_size 20M; # document/PDF uploads

    location / {
        proxy_pass http://127.0.0.1:8010;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
