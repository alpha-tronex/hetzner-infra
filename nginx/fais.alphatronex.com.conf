# Old address of the public FAIS demo, on the shared box. Since 2026-10-23 the demo is
# https://demo.faislaw.com (demo.faislaw.com.conf); this vhost only 301-redirects there, keeping
# paths and queries. Its certificate renews here. Drop it once old links no longer matter.

server {
    server_name fais.alphatronex.com;

    client_max_body_size 20M; # document/PDF uploads

    # Moved to demo.faislaw.com on 2026-10-23. Paths and queries are kept.
    location / {
        return 301 https://demo.faislaw.com$request_uri;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/fais.alphatronex.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/fais.alphatronex.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}


server {
    if ($host = fais.alphatronex.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    server_name fais.alphatronex.com;
    return 404; # managed by Certbot


}