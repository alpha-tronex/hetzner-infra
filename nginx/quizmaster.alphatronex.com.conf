# Vhost for quiz-master (quizmaster-app container, docker-compose.prod.yml
# lives in the quizzes repo, published to 127.0.0.1:8020). Matches the
# fais-app pattern: source + Dockerfile/compose live in the app repo, this
# repo only carries the nginx vhost.
#
# This is the PRE-CERTBOT version (HTTP only, port 80). After DNS resolves
# and this file is in place, run:
#   sudo certbot --nginx -d quizmaster.alphatronex.com
# Certbot will rewrite this file in place to add the HTTPS server block and
# the HTTP->HTTPS redirect, matching nginx/fais.alphatronex.com.conf.

server {
    listen 80;
    server_name quizmaster.alphatronex.com;

    client_max_body_size 5M;

    location / {
        proxy_pass http://127.0.0.1:8020;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
