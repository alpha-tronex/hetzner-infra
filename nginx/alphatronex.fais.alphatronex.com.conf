# Old address of the Alpha Tronex test firm, on the shared box (where its DNS record still points).
# Since 2026-10-23 the firm is https://alphatronex.faislaw.com on the client-data server fais-clients;
# this vhost only 301-redirects there, keeping paths and queries. Its certificate (expires 2027-01-18)
# renews here. Drop it, its certificate and the DNS record once old links no longer matter.

server {
    server_name alphatronex.fais.alphatronex.com;

    client_max_body_size 20M; # document/PDF uploads

    # Moved to alphatronex.faislaw.com on 2026-10-23 (served by fais-clients). Paths and queries
    # are kept, so old password-reset and appointment links still work.
    location / {
        return 301 https://alphatronex.faislaw.com$request_uri;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/alphatronex.fais.alphatronex.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/alphatronex.fais.alphatronex.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}


server {
    if ($host = alphatronex.fais.alphatronex.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    server_name alphatronex.fais.alphatronex.com;

    listen 80;
    return 404; # managed by Certbot


}