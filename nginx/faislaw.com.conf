# faislaw.com and www.faislaw.com on the shared box. Until there's a landing page, both send
# visitors to the demo with a temporary 302 (not 301, so browsers don't cache it and a landing page
# can replace it). Live, certbot-managed version: one certificate
# for faislaw.com and www.faislaw.com, issued 2026-10-23, expires 2027-01-21, auto-renews.

server {
    server_name faislaw.com www.faislaw.com;

    location / {
        return 302 https://demo.faislaw.com$request_uri;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/faislaw.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/faislaw.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot



}


server {
    if ($host = www.faislaw.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    if ($host = faislaw.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    server_name faislaw.com www.faislaw.com;

    listen 80;
    return 404; # managed by Certbot




}
