# faislaw.com and www.faislaw.com on the shared box. www serves the FAIS product pages from the
# demo container (fais-app, host port 8010), the same as demo.faislaw.com; the client sends Client
# login and the app pages to demo.faislaw.com (client/src/app/utils/marketing-host.ts in FAIS).
# The bare domain 301s to www. One certbot certificate covers faislaw.com and www.faislaw.com,
# issued 2026-10-23, auto-renews.

server {
    server_name faislaw.com;

    return 301 https://www.faislaw.com$request_uri;

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/faislaw.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/faislaw.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    server_name www.faislaw.com;

    client_max_body_size 20M;

    location / {
        proxy_pass http://127.0.0.1:8010;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/faislaw.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/faislaw.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    if ($host = www.faislaw.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    if ($host = faislaw.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    server_name faislaw.com www.faislaw.com;

    listen 80;
    return 404; # managed by Certbot
}
