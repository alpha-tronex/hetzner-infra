# faislaw.com and www.faislaw.com on the shared box. Until there's a landing page, both send
# visitors to the demo with a temporary 302 (not 301, so browsers don't cache it and a landing page
# can replace it). Certbot adds the TLS lines on first issue.

server {
    server_name faislaw.com www.faislaw.com;

    location / {
        return 302 https://demo.faislaw.com$request_uri;
    }

    listen 80;
}
