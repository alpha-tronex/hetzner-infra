# Vhost for the Law Office of Christophe Fiori, PLLC on the client-data server fais-clients
# (178.156.222.192): fais-fiori container, app-fiori service in FAIS/docker-compose.clients.yml,
# host port 8012. Runbook: FAIS/docs/operations/ONBOARDING_RUNBOOK.md. Certbot adds the TLS lines on first issue.

server {
    server_name fiori.faislaw.com;

    client_max_body_size 20M; # document/PDF uploads

    location / {
        proxy_pass http://127.0.0.1:8012;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/fiori.faislaw.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/fiori.faislaw.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}


server {
    if ($host = fiori.faislaw.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    server_name fiori.faislaw.com;

    listen 80;
    return 404; # managed by Certbot


}