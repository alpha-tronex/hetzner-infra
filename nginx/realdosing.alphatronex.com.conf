# Real Dosing has moved to the dosinghub.com domain. This vhost now exists
# only to 301-redirect the old realdosing.alphatronex.com subdomain there,
# preserving any existing links/bookmarks. Site content is no longer served
# from here directly — see nginx/dosinghub.com.conf and the supplement-price-app
# repo for the actual source/deploy instructions.

server {
    server_name realdosing.alphatronex.com;

    location / {
        return 301 https://dosinghub.com$request_uri;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/realdosing.alphatronex.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/realdosing.alphatronex.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}


server {
    if ($host = realdosing.alphatronex.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    server_name realdosing.alphatronex.com;
    return 404; # managed by Certbot


}
