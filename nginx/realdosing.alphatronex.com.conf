# Real Dosing — omega-3 pricing prototype (Milestone 1). Static files, NOT
# proxied to a container (same pattern as the root alphatronex.com splash
# page). Served directly from /var/www/realdosing on the server.
#
# Source lives in the supplement-price-app repo (web/index.html, style.css,
# app.js, data.js — data.js is generated by
# scripts/build_omega3_prototype_data.py from the priced CSVs in that repo).
# This repo only carries the nginx vhost, matching the FAIS pattern where the
# app source lives elsewhere. Deploy with:
#   rsync -a /Users/alphathiam/Documents/Development/GitHub/supplement-price-app/web/ hetzner:/var/www/realdosing/

server {
    server_name realdosing.alphatronex.com;
    root /var/www/realdosing;
    index index.html;
    location / {
        try_files $uri $uri/ =404;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/realdosing.alphatronex.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/realdosing.alphatronex.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}


server {
    if ($host = realdosing.alphatronex.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    server_name realdosing.alphatronex.com;
    return 404; # managed by Certbot


}
