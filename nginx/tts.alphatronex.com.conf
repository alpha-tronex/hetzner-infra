# nginx vhost for tts-service. Copy into hetzner-infra/nginx/ and to the server
# (see DEPLOY.md). Certbot adds the TLS lines to this file on the server.
limit_req_zone $binary_remote_addr zone=tts_speak:10m rate=5r/s;

server {
    listen 80;
    server_name tts.alphatronex.com;

    client_max_body_size 16k;      # requests are a short JSON body

    location = /health {
        proxy_pass http://127.0.0.1:8300;
    }

    location = /speak {
        limit_req zone=tts_speak burst=10 nodelay;
        proxy_pass http://127.0.0.1:8300;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;    # a long Wolof sentence can take several seconds on CPU
    }

    location / {
        return 404;
    }
}
