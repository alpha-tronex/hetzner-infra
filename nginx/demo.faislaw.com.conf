# Vhost for the public FAIS demo (fais-app container, docker-compose.prod.yml in the FAIS repo,
# published to host port 8010) on the shared box. Replaces fais.alphatronex.com, which now
# 301-redirects here (fais.alphatronex.com.conf). Certbot adds the TLS lines on first issue.

server {
    server_name demo.faislaw.com;

    client_max_body_size 20M; # document/PDF uploads

    location / {
        proxy_pass http://127.0.0.1:8010;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    listen 80;
}
