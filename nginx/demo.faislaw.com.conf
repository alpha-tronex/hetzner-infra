# Vhost for the public FAIS demo (fais-app container, docker-compose.prod.yml in the FAIS repo,
# published to host port 8010) on the shared box. Replaces fais.alphatronex.com, which now
# 301-redirects here (fais.alphatronex.com.conf). Live, certbot-managed version:
# certificate issued 2026-10-23, expires 2027-01-21, auto-renews.

server {
    server_name demo.faislaw.com;

    client_max_body_size 20M; # document/PDF uploads

    location / {
        proxy_pass http://127.0.0.1:8010;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/demo.faislaw.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/demo.faislaw.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}


server {
    if ($host = demo.faislaw.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    server_name demo.faislaw.com;

    listen 80;
    return 404; # managed by Certbot


}