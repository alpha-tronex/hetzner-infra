# Response compression for every site on the server. Install on both servers (the shared box and
# fais-clients) at /etc/nginx/conf.d/compression.conf; nginx.conf includes conf.d/*.conf inside its
# http block.
#
# Ubuntu's nginx.conf turns `gzip on` but leaves the rest commented out, so only text/html was
# compressed: the FAIS app's JavaScript (~736 kB) and CSS went out uncompressed (checked 2026-11-26
# on www.faislaw.com). These settings extend it to the other text types. If nginx.conf ever
# uncomments its own gzip_* lines, `nginx -t` reports a duplicate directive: keep one copy.
#
# Brotli would need an extra nginx module; gzip already cuts the FAIS bundle to about a quarter.

gzip_vary on;
gzip_proxied any;
gzip_comp_level 5;
gzip_min_length 1024;
gzip_types
    text/css
    text/plain
    text/javascript
    application/javascript
    application/json
    application/manifest+json
    application/xml
    application/rss+xml
    image/svg+xml
    font/ttf
    font/otf;
