# Drop-in for the client-data server (fais-clients) only: tags its snapshots with their own restic
# host, so `restic forget` on each server only touches that server's snapshots.
# Installed at /etc/systemd/system/fais-backup.service.d/fais-clients.conf on fais-clients.
[Service]
Environment=FAIS_BACKUP_HOST=fais-clients
